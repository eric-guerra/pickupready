services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_DATABASE: pickup, MYSQL_USER: pickup, MYSQL_PASSWORD: pickup, MYSQL_ROOT_PASSWORD: root }
    ports: ["3306:3306"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./backend
    environment: { DB_HOST: mysql, REDIS_HOST: redis }
    ports: ["8080:8080"]
    depends_on: [mysql, redis]
